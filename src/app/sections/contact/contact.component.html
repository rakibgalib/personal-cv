<section class="modern-contact" id="contact">
  <!-- Background Decoration -->
  <div class="contact-bg">
    <div class="contact-gradient"></div>
  </div>

  <div class="container">
    <!-- Section Header -->
    <div class="section-header text-center">
      <span class="section-subtitle">Get In Touch</span>
      <h2 class="section-title">Let's Work Together</h2>
      <p class="section-description">
        Have a project in mind or just want to chat? Feel free to reach out!
      </p>
    </div>

    <div class="contact-content">

      <!-- Contact Info Cards -->
      <div class="contact-info">
        <div class="info-card">
          <div class="info-icon email-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <h3>Email</h3>
          <p>example@email.com</p>
          <a href="mailto:example@email.com" class="info-link">Send Email</a>
        </div>

        <div class="info-card">
          <div class="info-icon phone-icon">
            <i class="fas fa-phone"></i>
          </div>
          <h3>Phone</h3>
          <p>+1 (555) 123-4567</p>
          <a href="tel:+15551234567" class="info-link">Call Now</a>
        </div>

        <div class="info-card">
          <div class="info-icon location-icon">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <h3>Location</h3>
          <p>San Francisco, CA</p>
          <a href="#" class="info-link">View Map</a>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <form class="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Project Inquiry">
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">
            <span>Send Message</span>
            <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>

      <!-- Social Links -->
      <div class="contact-social">
        <h3>Follow Me</h3>
        <div class="social-links">
          <a href="#" class="social-link facebook">
            <i class="fab fa-facebook-f"></i>
          </a>
          <a href="#" class="social-link twitter">
            <i class="fab fa-twitter"></i>
          </a>
          <a href="#" class="social-link linkedin">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="#" class="social-link github">
            <i class="fab fa-github"></i>
          </a>
          <a href="#" class="social-link instagram">
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
